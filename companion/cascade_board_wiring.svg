<text x="125.0" y="42" font-size="2.6" text-anchor="middle" font-family="sans-serif" fill="#a23">LOW gain (Rg2 12k) = linear baseline (one linear map).  HIGH gain (Rg2 1.2k) = op-amp CLIPS at its rails = the real non-linear 2-step.  No diodes.</text>
